<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sony · Chat</title>
<style>
/* Ventana de chat completa: barra superior con mini núcleo, lateral con conversaciones y archivos, conversación al centro, barra de escribir abajo. */
:root{
  --bg:#060b12; --bg2:#0c1622; --panel:rgba(12,26,40,.6); --line:rgba(79,212,255,.22);
  --fg:#e4eef6; --muted:#8aa0b4; --cyan:#4fd4ff; --ice:#b8f4ff; --amber:#ffb454; --green:#3ddc97; --red:#ff5c6c;
  --display:'Avenir Next Condensed','DIN Condensed','Arial Narrow',system-ui,sans-serif; --body:-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#0f2236,var(--bg) 65%);background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(79,212,255,.025) 0 1px,transparent 1px 3px);z-index:50}
.grid{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(79,212,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,212,255,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:12px}

/* barra superior */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;border:1px solid var(--line);background:rgba(10,22,34,.7);position:relative}
.top::before,.top::after,.hud::before,.hud::after,.conv::before,.conv::after{content:"";position:absolute;width:12px;height:12px;border:solid var(--cyan);pointer-events:none}
.top::before,.hud::before,.conv::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.top::after,.hud::after,.conv::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
#mini{width:52px;height:52px;flex:none}
.title{display:flex;flex-direction:column;min-width:0}
.title b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.32em;text-transform:uppercase}
.title span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--st,var(--cyan));transition:color .4s}
.title span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;margin-right:8px;vertical-align:1px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
.topR{margin-left:auto;display:flex;gap:8px;align-items:center}
.clock{font-family:var(--display);font-size:18px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums;margin-right:6px}
.tbtn{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);padding:9px 14px;cursor:pointer}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.tbtn:focus-visible,.cbtn:focus-visible,.clip:focus-within,.item:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* cuerpo */
.body{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;min-height:0}
.side{display:grid;gap:12px;align-content:start;overflow-y:auto;min-height:0}
.hud{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.hud h3{margin:0 0 9px;display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan)}
.hud h3 i{font-style:normal;color:var(--muted);font-weight:500;letter-spacing:.1em}
.item{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--fg);padding:8px 10px;cursor:pointer;font-family:var(--body);font-size:13.5px;line-height:1.35}
.item small{display:block;color:var(--muted);font-size:12px}
.item:hover{border-color:var(--line);background:rgba(79,212,255,.05)}
.item.on{border-color:var(--cyan);background:rgba(79,212,255,.1)}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.files li{display:flex;gap:8px;align-items:center;min-width:0}
.files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ext{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;color:#04121c;background:var(--cyan);padding:2px 5px;flex:none}
.empty{color:var(--muted);font-size:13px}

.conv{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;border:1px solid var(--line);background:rgba(8,18,28,.55)}
.msgs{overflow-y:auto;padding:22px clamp(14px,4vw,48px);display:flex;flex-direction:column;gap:14px;min-height:0}
.day{align-self:center;font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:12px;width:100%}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.m{max-width:min(680px,84%);padding:10px 14px 11px;line-height:1.5;overflow-wrap:anywhere;position:relative;animation:in .35s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m header{display:flex;gap:10px;align-items:baseline;font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.24em;margin-bottom:3px}
.m header time{color:var(--muted);font-weight:500;letter-spacing:.08em}
.m.yo{align-self:flex-end;background:rgba(79,212,255,.08);border-right:2px solid var(--cyan);text-align:right}
.m.yo header{color:var(--cyan);justify-content:flex-end}
.m.sony{align-self:flex-start;background:rgba(255,180,84,.06);border-left:2px solid var(--amber)}
.m.sony header{color:var(--amber)}
.tool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tool span{font-size:11.5px;letter-spacing:.06em;color:var(--ice);border:1px solid var(--line);padding:3px 8px;background:rgba(79,212,255,.05)}
.tool span::before{content:"✓ ";color:var(--green)}
.m img{display:block;max-width:260px;max-height:200px;margin:6px 0 0 auto;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:10px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);text-align:left}
.chip small{display:block;color:var(--muted);font-size:12px}
.ask{align-self:flex-start;max-width:min(560px,90%);border:1px solid var(--amber);background:rgba(255,180,84,.06);padding:14px 16px;box-shadow:0 0 24px rgba(255,180,84,.15)}
.ask h4{margin:0 0 6px;font-family:var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-size:13px}
.ask blockquote{margin:8px 0 12px;padding:6px 12px;border-left:2px solid var(--amber);color:var(--muted)}
.ask .acts{display:flex;gap:8px}
.ask button{flex:1;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:10px;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line)}
.ask .yes{border-color:var(--green);color:var(--green)}.ask .no:hover{border-color:var(--red);color:var(--red)}
.ask.done{opacity:.7}.ask.done .acts{display:none}
.typing{align-self:flex-start;display:flex;gap:6px;padding:12px 14px;border-left:2px solid var(--amber);background:rgba(255,180,84,.05)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.2;transform:translateY(-3px)}}

form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:rgba(79,212,255,.03)}
.clip,.mic{width:48px;flex:none;display:grid;place-items:center;border:1px solid var(--line);color:var(--cyan);cursor:pointer;background:transparent}
.clip:hover,.mic:hover{background:rgba(79,212,255,.12)}
.clip svg,.mic svg{width:21px;height:21px}
.mic.on{border-color:var(--cyan);box-shadow:0 0 16px rgba(79,212,255,.5) inset;animation:blink 1s infinite}
#txt{flex:1;min-width:0;background:rgba(4,10,16,.85);color:var(--fg);border:1px solid var(--line);padding:13px 16px;font-size:15.5px;font-family:var(--body);border-radius:0}
#txt:focus-visible{outline:2px solid var(--cyan)}
.cbtn{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:14px;background:transparent;color:var(--cyan);border:1px solid var(--cyan);padding:0 20px;cursor:pointer;box-shadow:0 0 12px rgba(79,212,255,.2) inset}
.cbtn:hover{background:rgba(79,212,255,.15)}
.conv.drop{box-shadow:0 0 0 2px var(--cyan),0 0 60px rgba(79,212,255,.35)}
.conv.drop::after{content:"Suelta aquí para que Sony lo examine";position:absolute;inset:14px;display:grid;place-items:center;border:2px dashed var(--cyan);background:rgba(6,14,22,.88);color:var(--cyan);font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;font-size:16px;width:auto;height:auto;z-index:5}
@media (max-width:820px){.body{grid-template-columns:minmax(0,1fr)}.cbtn{padding:0 12px}.side{display:none}.topR .tbtn.hideS,.clock{display:none}.top{gap:10px;padding:6px 10px}.title b{font-size:20px}}
html,body{margin:0}[hidden]{display:none!important}
.pend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 0}.pend:empty{display:none}.pend span{font-size:12px;padding:3px 8px;border:1px solid var(--line)}
.tool span.no::before{content:"✕ ";color:var(--red)}
.tbtn.stop{border-color:var(--red);color:#ffb3ba}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div class="grid"></div>
<div class="app">
  <div class="top">
    <canvas id="mini" width="104" height="104" aria-hidden="true"></canvas>
    <div class="title"><b>Sony</b><span id="st">En línea</span></div>
    <div class="topR">
      <div class="clock" id="clock">--:--</div>
      <button class="tbtn stop" id="parar" type="button" hidden>Parar</button>
      <button class="tbtn hideS" id="newC" type="button">Nueva conversación</button>
      <button class="tbtn" id="clr" type="button" title="Borra esta conversación y empieza de cero">Borrar</button>
      <button class="tbtn" id="nuc" type="button" title="Volver a la pantalla del núcleo">◉ Núcleo</button>
      <button class="tbtn hideS" id="mas" type="button" title="Chat con todas las opciones: proyectos, programados, ajustes">Más opciones</button>
    </div>
  </div>

  <div class="body">
    <aside class="side">
      <section class="hud">
        <h3>Conversaciones <i>01</i></h3>
        <div id="convs"></div>
      </section>
      <section class="hud">
        <h3>Archivos <i>02</i></h3>
        <ul class="files" id="files"></ul>
      </section>
      <section class="hud">
        <h3>Sony puede <i>03</i></h3>
        <div class="empty">Leer tu correo y prepararte respuestas, mirar tu agenda, buscar en Drive, ver fotos y leer documentos, buscar en internet y en tu segundo cerebro. Siempre te pide permiso antes de enviar, publicar o borrar algo.</div>
      </section>
    </aside>

    <section class="conv" id="conv">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="pend" id="pend"></div>
      <form id="form">
        <label class="clip" title="Adjuntar foto o documento"><input id="file" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx,.csv,.ppt,.pptx" hidden aria-label="Adjuntar foto o documento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l8-8"/></svg></label>
        <input id="txt" placeholder="Escribe a Sony o arrastra un archivo…" autocomplete="off" aria-label="Escribe a Sony">
        <button class="mic" id="mic" type="button" aria-label="Hablar" title="Hablar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="cbtn" type="submit">Enviar</button>
      </form>
    </section>
  </div>
</div>

<script>
(function(){
  // Chat completo de Sony (diseño aprobado 18/11). Va en un marco dentro de la ventana de Sony y usa la conversación real
  // de la página que lo contiene (P): enviar, subirArchivos, responderPermiso, borrarConversacion, nuevoChat, abrirHilo, Voz.
  // Todo lo que escribe el usuario o responde Sony se mete con textContent: nunca se interpreta como código.
  const P = window.parent, $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COL = { idle: [79, 212, 255], listen: [34, 200, 255], think: [139, 92, 255], speak: [255, 154, 46] };
  const LBL = { idle: 'En línea', listen: 'Te escucho…', think: 'Pensando…', speak: 'Hablando…' };
  let state = 'idle', cur = COL.idle.slice();
  function setState(s) { if (s === state) return; state = s; $('st').textContent = LBL[s]; $('st').style.setProperty('--st', `rgb(${COL[s].join(',')})`); }
  function leerEstado() {
    const e = P.Voz?.estado;
    if (e === 'hablando') return 'speak';
    if (e === 'pensando' || e === 'transcribiendo' || P.S?.generando) return 'think';
    if (P.Voz?.activo && (e === 'escuchando' || e === 'oyendo')) return 'listen';
    return 'idle';
  }

  // mini núcleo de partículas (del diseño)
  const cv = $('mini'), x = cv.getContext('2d'), N = 420, pts = [];
  for (let i = 0; i < N; i++) { const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.399963; pts.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
  function draw(t) {
    t /= 1000; cur = cur.map((v, i) => v + (COL[state][i] - v) * .08); const c = cur.map(v => v | 0).join(',');
    const e = state === 'idle' ? .05 : state === 'think' ? .12 : .25; x.clearRect(0, 0, 104, 104);
    const g = x.createRadialGradient(52, 52, 0, 52, 52, 50); g.addColorStop(0, `rgba(${c},.35)`); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 104, 104);
    x.strokeStyle = `rgba(${c},.9)`; x.lineWidth = 2.2; const sp = state === 'think' ? 3 : 1;
    for (let k = 0; k < 3; k++) { const a = t * sp + k * 2.094; x.beginPath(); x.arc(52, 52, 44, a, a + 1.6); x.stroke(); }
    const ry = t * (state === 'think' ? 1.4 : .5), cs = Math.cos(ry), sn = Math.sin(ry);
    for (const p of pts) { const px = p[0] * cs - p[2] * sn, pz = p[0] * sn + p[2] * cs, py = p[1];
      const n = Math.sin(px * 4 + t * 2) * Math.sin(py * 5 - t * 1.6) * e; const R = 26 * (1 + n + (state === 'speak' ? Math.abs(Math.sin(t * 7)) * .06 : 0));
      const d = (pz + 1) / 2; x.fillStyle = `rgba(${c},${.2 + d * .75})`; x.fillRect(52 + px * R, 52 + py * R, 1 + d * 1.4, 1 + d * 1.4); }
    if (!reduce) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw); if (reduce) setInterval(() => draw(performance.now()), 500);
  const hm = s => new Date((s || Date.now() / 1000) * 1000).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  function tick() { $('clock').textContent = hm(); } tick(); setInterval(tick, 10000);

  const msgs = $('msgs'); let firma = '', firmaBase = '', ultimos = [], alFondo = true;
  msgs.addEventListener('scroll', () => { alFondo = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60; });
  const limpio = t => (t || '').replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s+/gm, '').replace(/```[a-z]*\n?/g, '').trim();
  const ext = n => ((n || '').split('.').pop() || 'doc').toUpperCase().slice(0, 4);
  function burbuja(m, i, ultimo) {
    const yo = m.rol === 'user', d = document.createElement('div'); d.className = 'm ' + (yo ? 'yo' : 'sony');
    const h = document.createElement('header'), tm = document.createElement('time'); tm.textContent = hm(m.t);
    if (yo) h.append(tm, 'TÚ'); else h.append('SONY', tm); d.append(h);
    for (const a of (m.adjuntos || [])) {
      if (a.tipo === 'imagen' && /^[\w-]+$/.test(a.id || '')) { const img = document.createElement('img'); img.alt = a.nombre || 'foto'; img.src = '/api/adjuntos/' + a.id; d.append(img); }
      else { const c = document.createElement('div'); c.className = 'chip'; const b = document.createElement('b'); b.className = 'ext'; b.textContent = ext(a.nombre); const t = document.createElement('div'); t.textContent = a.nombre || 'documento';
        if (a.bytes) { const sm = document.createElement('small'); sm.textContent = Math.max(1, Math.round(a.bytes / 1024)) + ' KB'; t.append(sm); } c.append(b, t); d.append(c); }
    }
    const texto = limpio(m.texto) || m.error || '';
    if (texto) { const p = document.createElement('div'); p.style.whiteSpace = 'pre-wrap'; p.textContent = texto; d.append(p); }
    const hechos = (m.pasos || []).filter(p => ['hecho', 'denegado', 'error', 'bloqueado'].includes(p.estado));
    if (hechos.length) { const tl = document.createElement('div'); tl.className = 'tool'; const vistos = new Set();
      hechos.forEach(p => { const k = (p.titulo || p.herramienta) + p.estado; if (vistos.has(k)) return; vistos.add(k); const s = document.createElement('span'); if (p.estado !== 'hecho') s.className = 'no'; s.textContent = (p.titulo || p.herramienta) + (p.estado === 'hecho' ? '' : p.estado === 'denegado' ? ' · no permitido' : ' · no se pudo'); tl.append(s); }); d.append(tl); }
    const out = [d];
    for (const p of (m.pasos || [])) {
      if (p.estado !== 'permiso' && !(p.estado === 'denegado' && p.resumen === 'Denegado por ti')) continue;
      const a = document.createElement('div'); a.className = 'ask' + (p.estado === 'permiso' ? '' : ' done');
      const h4 = document.createElement('h4'); h4.textContent = 'Sony pide permiso'; a.append(h4, document.createTextNode('Quiere: ' + (p.titulo || p.herramienta)));
      const q = document.createElement('blockquote'); q.textContent = (p.detalle || '').slice(0, 600); a.append(q);
      if (p.estado === 'permiso' && ultimo && P.S.generando) {
        const acts = document.createElement('div'); acts.className = 'acts';
        const si = document.createElement('button'); si.className = 'yes'; si.type = 'button'; si.textContent = 'Permitir'; si.onclick = () => { P.responderPermiso(p.id, 'una', i); firma = ''; };
        const no = document.createElement('button'); no.className = 'no'; no.type = 'button'; no.textContent = 'No permitir'; no.onclick = () => { P.responderPermiso(p.id, 'denegar', i); firma = ''; };
        acts.append(si, no); a.append(acts);
      } else if (p.estado !== 'permiso') { const r = document.createElement('div'); r.style.marginTop = '6px'; r.style.color = 'var(--red)'; r.textContent = '✕ No permitido'; a.append(r); }
      out.push(a);
    }
    if (ultimo && m.vivo && !texto && !(m.pasos || []).some(p => p.estado === 'permiso')) { const ty = document.createElement('div'); ty.className = 'typing'; ty.innerHTML = '<i></i><i></i><i></i>'; out.push(ty); }
    return out;
  }
  function pintar() {
    const ms = P.S?.hilo?.mensajes || [];
    const f = (P.S?.hilo?.id || '') + ':' + ms.length + ':' + ms.map(m => (m.texto || m.error || '').length + '/' + (m.pasos || []).map(p => p.estado).join('') + '/' + (m.adjuntos || []).length + (m.vivo ? 'v' : '')).join(',') + (P.S?.generando ? 'g' : '');
    if (f === firma) return; firma = f;
    // si solo cambia el último mensaje (Sony escribiendo), se rehace solo ese: no salta el scroll ni se pierde la selección
    const base = (P.S?.hilo?.id || '') + ':' + ms.length + ':' + ms.slice(0, -1).map(m => (m.texto || '').length + '/' + (m.pasos || []).length).join(',');
    if (base === firmaBase && ultimos.length && ultimos[0].isConnected && ms.length) {
      const nuevos = burbuja(ms[ms.length - 1], ms.length - 1, true);
      ultimos[0].before(...nuevos); ultimos.forEach(n => n.remove()); ultimos = nuevos;
      if (alFondo) msgs.scrollTop = msgs.scrollHeight; return;
    }
    firmaBase = base;
    const dia = document.createElement('div'); dia.className = 'day'; dia.textContent = 'Hoy';
    const nodos = [dia]; ultimos = []; ms.forEach((m, i) => { const b = burbuja(m, i, i === ms.length - 1); nodos.push(...b); if (i === ms.length - 1) ultimos = b; });
    if (!ms.length) { const d = document.createElement('div'); d.className = 'm sony'; const h = document.createElement('header'); h.append('SONY'); d.append(h, document.createTextNode('Conversación nueva. ¿En qué te ayudo?')); nodos.push(d); }
    msgs.replaceChildren(...nodos); if (alFondo) msgs.scrollTop = msgs.scrollHeight;
    // archivos de esta conversación
    const L = $('files'), adj = ms.flatMap(m => m.adjuntos || []);
    L.replaceChildren(...(adj.length ? adj.slice(-12).reverse().map(a => { const li = document.createElement('li'), b = document.createElement('b'), s = document.createElement('span'); b.className = 'ext'; b.textContent = a.tipo === 'imagen' ? 'IMG' : ext(a.nombre); s.textContent = a.nombre || ''; li.append(b, s); return li; })
      : [Object.assign(document.createElement('li'), { className: 'empty', textContent: 'Aún no hay archivos en esta conversación.' })]));
  }
  let firmaL = '';
  function lista() {
    const hs = (P.S?.hilos || []).slice().sort((a, b) => (b.actualizado || 0) - (a.actualizado || 0)).slice(0, 25), act = P.S?.hilo?.id;
    const f = act + hs.map(h => h.id + (h.titulo || '')).join('|'); if (f === firmaL) return; firmaL = f;
    const hoy = new Date().toDateString();
    $('convs').replaceChildren(...(hs.length ? hs.map(h => { const b = document.createElement('button'); b.type = 'button'; b.className = 'item' + (h.id === act ? ' on' : ''); b.textContent = (h.titulo || 'Conversación').slice(0, 60);
      const sm = document.createElement('small'); const dt = new Date((h.actualizado || h.creado || 0) * 1000); sm.textContent = (dt.toDateString() === hoy ? 'Hoy' : dt.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })) + ' · ' + hm(h.actualizado || h.creado);
      b.append(sm); b.onclick = () => { P.abrirHilo(h.id); firma = ''; }; return b; })
      : [Object.assign(document.createElement('div'), { className: 'empty', textContent: 'Aún no hay conversaciones.' })]));
  }
  function pulso() {
    if (document.hidden || P.Nucleo?.vista !== 'chat') return;  // sin gastar si no se ve
    setState(leerEstado()); pintar(); lista();
    $('mic').classList.toggle('on', !!P.Voz?.activo); $('mic').title = P.Voz?.activo ? 'Dejar de escuchar' : 'Hablar';
    const L = P.S?.adjuntos || []; $('pend').replaceChildren(...L.map(a => { const s = document.createElement('span'); s.textContent = (a.subiendo ? '⏳ ' : a.tipo === 'imagen' ? '🖼 ' : '📄 ') + (a.nombre || ''); return s; }));
    $('parar').hidden = !(P.S?.generando || P.Voz?.estado === 'hablando');
  }
  setInterval(pulso, 200); setTimeout(pulso, 50);

  // escribir, hablar, parar
  $('form').addEventListener('submit', e => { e.preventDefault(); const v = $('txt').value.trim(); if (!v && !(P.S.adjuntos || []).length) return; $('txt').value = ''; alFondo = true; P.enviar(v); });
  $('mic').onclick = () => P.Voz.iniciar();
  $('parar').onclick = () => { try { P.pararGeneracion?.(); } catch {} P.Voz?.callar(); };
  // adjuntar: las fotos las ve Sony y los documentos los lee (se suben solo a Sony, en este Mac)
  const fileIn = $('file'), conv = $('conv');
  fileIn.addEventListener('change', () => { if (fileIn.files.length) P.subirArchivos([...fileIn.files]); fileIn.value = ''; });
  let dc = 0;
  conv.addEventListener('dragenter', e => { e.preventDefault(); dc++; conv.classList.add('drop'); });
  conv.addEventListener('dragover', e => e.preventDefault());
  conv.addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; conv.classList.remove('drop'); } });
  conv.addEventListener('drop', e => { e.preventDefault(); dc = 0; conv.classList.remove('drop'); if (e.dataTransfer.files.length) P.subirArchivos([...e.dataTransfer.files]); });
  // botones de arriba
  $('clr').onclick = () => { P.borrarConversacion(); firma = firmaBase = ''; };
  $('newC').onclick = () => { P.nuevoChat(); firma = ''; };
  $('nuc').onclick = () => P.Nucleo.mostrar(true);
  $('mas').onclick = () => P.Nucleo.chat(false);
  addEventListener('keydown', e => { if (e.key === 'Escape') P.Voz?.callar(); });
  $('txt').focus();
})();
</script>

</body></html>
